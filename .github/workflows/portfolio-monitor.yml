name: Portfolio Monitor

on:
  # Run every 5 minutes during US market hours (9:30-16:00 ET = 14:30-21:00 UTC)
  schedule:
    - cron: '*/5 14-21 * * 1-5'  # Every 5 min, Mon-Fri, during market hours

  # Allow manual trigger
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas ta twilio

      - name: Run portfolio monitor (SELL alerts)
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: |
          python cloud_monitor.py

      - name: Run golden opportunity scanner (BUY alerts)
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: |
          python golden_scanner.py

      - name: Save signal state
        uses: actions/upload-artifact@v4
        with:
          name: signals-state
          path: last_signals.json
          retention-days: 1
        if: always()

      - name: Download previous signals
        uses: actions/download-artifact@v4
        with:
          name: signals-state
          path: .
        continue-on-error: true
